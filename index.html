const EDGE_TABLE_SIZE = 6561;

function buildEdgeTable(){
  edgeTable = new Int16Array(EDGE_TABLE_SIZE);
  for(let idx=0; idx<EDGE_TABLE_SIZE; idx++){
    let tmp=idx;
    let cells=[];
    for(let i=0;i<8;i++){ cells.push(tmp%3); tmp=Math.floor(tmp/3); } // 0=empty,1=black,2=white
    let bCnt=0,oCnt=0,score=0;
    for(let v of cells){ if(v===1) bCnt++; else if(v===2) oCnt++; }
    // full edge -400
    if(bCnt>=6) score-=400;
    if(oCnt>=6) score+=400;
    // unbalanced 5連続+空き隣
    for(let i=0;i<=3;i++){
      let runB=0, runO=0;
      for(let j=i;j<i+5;j++){ if(cells[j]===1) runB++; if(cells[j]===2) runO++; }
      if(runB===5){
        const next=i+5<8?cells[i+5]:-1, prev=i-1>=0?cells[i-1]:-1;
        if((next===0)||(prev===0)) score-=800;
      }
      if(runO===5){
        const next=i+5<8?cells[i+5]:-1, prev=i-1>=0?cells[i-1]:-1;
        if((next===0)||(prev===0)) score+=800;
      }
    }
    // wedge: 空きの両隣が相手色
    for(let i=1;i<7;i++){
      if(cells[i]!==0) continue;
      const l=cells[i-1], r=cells[i+1];
      if(l===2 && r===2) score-=600; // 黒の手番から見て、白が両隣=相手がそこに打たざるを得ない悪い形
      if(l===1 && r===1) score+=600;
    }

  }

}

              if (this.onmessageerror) this.onmessageerror(e);

            logErr('AudioWorkletWorker READY via prewarmed path, state:'+this._ctx.state);

        logErr('Created blob-app URL: '+blobUrl.slice(0,60));
      } catch (e) { logErr('Blob-app creation failed: '+e.message); }
      try {

      } catch (e) { logErr('Data-text-b64 creation failed: '+e.message); }

      } catch (e) { logErr('Data-text-plain creation failed: '+e.message); }
      try {
        const b64 = btoa(unescape(encodeURIComponent(processorCode)));
        const dataUrl = 'data:application/javascript;base64,'+b64;
        urlsToTry.push({url: dataUrl, type: 'data-app-b64', revoke: false});
        logErr('Created data-app-b64 len:'+dataUrl.length);
      } catch (e) { logErr('Data-app-b64 creation failed: '+e.message); }
      
      let addModuleSuccess = false;
      let lastError = null;
      for (const urlObj of urlsToTry) {
        try {
          logErr('Trying addModule with '+urlObj.type+': '+urlObj.url.slice(0,50));
          // Direct call first - most compatible, avoids Illegal invocation from detached method
          let addModulePromise;
          try {
            addModulePromise = this._ctx.audioWorklet.addModule(urlObj.url);
          } catch(e) {
            // Fallback: use call()

          }

          await Promise.race([addModulePromise, timeoutPromise]);
          logErr('AudioWorklet addModule OK with '+urlObj.type+' state:'+this._ctx.state);
          addModuleSuccess = true;
          if (urlObj.revoke) { try { URL.revokeObjectURL(urlObj.url); } catch(e) {} }
          break;
        } catch (e) {
          logErr('addModule FAILED with '+urlObj.type+': '+e.message+' name:'+e.name+' stack:'+(e.stack||'').slice(0,1000));
          if (urlObj.revoke) { try { URL.revokeObjectURL(urlObj.url); } catch(e2) {} }
          lastError = e;
        }
      }
      if (!addModuleSuccess) {
        throw lastError || new Error('All addModule URL types failed');
      }
      
      try {
        this._node = new AudioWorkletNode(this._ctx, 'othello-processor');
      } catch (e) {
        logErr('AudioWorkletNode creation FAILED: '+e.message+' name:'+e.name+' stack:'+(e.stack||'').slice(0,1000));
        throw e;
      }
      let gainNode;
      try {
        gainNode = this._ctx.createGain();
      } catch (e) {
        logErr('createGain FAILED: '+e.message);
        throw e;
      }
      gainNode.gain.value = 0;
      this._node.connect(gainNode);
      gainNode.connect(this._ctx.destination);
      this._node.port.onmessage = (e) => {
        if (this.onmessage) this.onmessage(e);
        const q = this._queue.get(e.data.id);
        if (q) { q.resolve(e.data); this._queue.delete(e.data.id); }
      };
      this._node.port.onmessageerror = (e) => {
        logErr('AudioWorklet onmessageerror: '+String(e));
        if (this.onmessageerror) this.onmessageerror(e);
      };
      this._ready = true;
      logErr('AudioWorkletWorker READY state:'+this._ctx.state);
      return this;
    } catch (e) {
      logErr('AudioWorkletWorker init FAILED: '+e.message+' stack:'+(e.stack||'').slice(0,800));
      throw e;
    }
  }
  postMessage(data) {
    if (!this._ready) throw new Error('AudioWorkletWorker not initialized');
    this._node.port.postMessage(data);
  }
  terminate() {
    try { this._node.disconnect(); } catch {}
    try {
      if (this._ctx && window.prewarmedAudioContext && this._ctx === window.prewarmedAudioContext) {
        logErr('AudioWorkletWorker terminated - keeping shared prewarmed ctx alive (state:'+this._ctx.state+')');
      } else {
        try { this._ctx.close(); } catch {}
        logErr('AudioWorkletWorker terminated (private ctx closed)');
      }
    } catch {}
    this._ready = false;
    this._queue.clear();
  }
}

const EDGE_TABLE_SIZE = 6561;

function buildEdgeTable(){
  edgeTable = new Int16Array(EDGE_TABLE_SIZE);
  for(let idx=0; idx<EDGE_TABLE_SIZE; idx++){
    let tmp=idx;
    let cells=[];
    for(let i=0;i<8;i++){ cells.push(tmp%3); tmp=Math.floor(tmp/3); } // 0=empty,1=black,2=white
    let bCnt=0,oCnt=0,score=0;
    for(let v of cells){ if(v===1) bCnt++; else if(v===2) oCnt++; }
    // full edge -400
    if(bCnt>=6) score-=400;
    if(oCnt>=6) score+=400;
    // unbalanced 5連続+空き隣
    for(let i=0;i<=3;i++){
      let runB=0, runO=0;
      for(let j=i;j<i+5;j++){ if(cells[j]===1) runB++; if(cells[j]===2) runO++; }
      if(runB===5){
        const next=i+5<8?cells[i+5]:-1, prev=i-1>=0?cells[i-1]:-1;
        if((next===0)||(prev===0)) score-=800;
      }
      if(runO===5){
        const next=i+5<8?cells[i+5]:-1, prev=i-1>=0?cells[i-1]:-1;
        if((next===0)||(prev===0)) score+=800;
      }
    }
    // wedge: 空きの両隣が相手色
    for(let i=1;i<7;i++){
      if(cells[i]!==0) continue;
      const l=cells[i-1], r=cells[i+1];
      if(l===2 && r===2) score-=600; // 黒の手番から見て、白が両隣=相手がそこに打たざるを得ない悪い形
      if(l===1 && r===1) score+=600;
    }

  }

}

function getBattleAdaptiveLimit(base, empty, legalCount, color){
  // Battle版は通常版と同じロジックだが貯金はbattleBankを使う
  if(!isFinite(base)) return Infinity;
  const points = [
    [60, 0.28],[55, 0.32],[52, 0.36],[48, 0.44],[45, 0.52],[42, 0.62],[38, 0.74],[35, 0.85],[32, 0.94],[28, 1.04],[24, 1.14],[20, 1.22],[16, 1.28],[14, 1.32],[10, 1.36],[6, 1.38],[0, 1.40]
  ];
  let baseFactor = 1.0;
  for(let i=0;i<points.length-1;i++){
    const [e1,f1]=points[i]; const [e2,f2]=points[i+1];
    if(empty <= e1 && empty >= e2){ const t = (e1===e2)?0:(empty - e2)/(e1 - e2); baseFactor = f2 + (f1 - f2)*t; break; }
    if(empty > points[0][0]){ baseFactor = points[0][1]; break; }
    if(empty < points[points.length-1][0]){ baseFactor = points[points.length-1][1]; break; }
  }
  let legalFactor = 1.0;
  if(legalCount===1) legalFactor = 0.18; else if(legalCount===2) legalFactor = 0.55; else if(legalCount===3) legalFactor = 0.72; else if(legalCount===4) legalFactor = 0.85; else if(legalCount===5) legalFactor = 0.92; else if(legalCount===6) legalFactor = 0.98; else if(legalCount===7) legalFactor = 1.02; else if(legalCount===8) legalFactor = 1.06; else if(legalCount===9) legalFactor = 1.10; else if(legalCount>=10 && legalCount<=12) legalFactor = 1.15; else if(legalCount>=13) legalFactor = 1.20;
  let extraFactor = 1.0;
  let desired = base * baseFactor * legalFactor * extraFactor;
  let bank = color==='black'? (typeof battleBankB!=='undefined'?battleBankB:0) : (typeof battleBankW!=='undefined'?battleBankW:0);
  if(empty <= 28 && bank>0){
    let bankUseRate = 0.5;
    if(legalCount>=10) bankUseRate = 0.5; else if(legalCount>=8) bankUseRate = 0.45; else if(legalCount>=6) bankUseRate = 0.38; else bankUseRate = 0.30;
    if(empty<=18) bankUseRate = 0.5; else if(empty<=20) bankUseRate = Math.max(bankUseRate, 0.45);
    const extra = bank * bankUseRate;
    desired += extra;
  }
  const maxAllow = base + (bank>0? bank*0.5 : 0);
  if(bank<=0){ desired = Math.min(desired, base); }
  desired = Math.max(300, Math.min(desired, maxAllow>0? maxAllow : base*2));
  if(bank<=0 && isFinite(base)){ desired = Math.min(desired, base); }
  return desired;
}

          const elBb=document.getElementById('bank-b'); if(elBb) elBb.textContent=\\\`黒:\\\${(battleBankB/1000).toFixed(1)}s\\\`;
          const elBw=document.getElementById('bank-w'); if(elBw) elBw.textContent=\\\`白:\\\${(battleBankW/1000).toFixed(1)}s\\\`;
          updateBattleDepthStatsUI(best.depth, turnBlack?'black':'white');
          const elSt=document.getElementById('t-st'); if(elSt) elSt.textContent='計算完了';
          const elStatus=document.getElementById('status'); if(elStatus) elStatus.textContent=\\\`Game \\\${gameId} \\\${turnBlack?'黒':'白'} \\\${notate(mvIdx)}  depth\\\${best.depth} \\\${(elapsedForBank/1000).toFixed(2)}s\\\`;
        }catch(e){}
      }else{
        // 定石手番でもステータス連動
        try{
          const elSt=document.getElementById('t-st'); if(elSt) elSt.textContent='定石 '+battleHist.join(' ')+' → '+String.fromCharCode(97+(mvIdx%8))+(Math.floor(mvIdx/8)+1);
          const elMv=document.getElementById('t-mv'); if(elMv) elMv.textContent=notate(mvIdx);
          const elEv=document.getElementById('t-ev'); if(elEv) elEv.textContent='定石';
          const elD=document.getElementById('t-d'); if(elD) elD.textContent='-';
          const elY=document.getElementById('t-yoji'); if(elY) elY.textContent='定石';
        }catch(e){}
      }
      const bit=1n<<BigInt(mvIdx);
      logErr('battleProcess Phase8 validation: mvIdx:'+mvIdx+' isBook:'+isBook+' legalList:'+legalList+' pop:'+legalList.length);
      if(mvIdx<0 || mvIdx>=64 || !legalList.includes(mvIdx)){
        logErr('battleProcess: mvIdx invalid or not in legalList '+mvIdx+' -> fallback');
        if(legalList.length>0){ mvIdx=legalList[0]; logErr('Fallback mvIdx:'+mvIdx); } else { logErr('No legal moves fallback, resolve null'); resolve(null); return; }
      }
      // 定石でも黄色枠を一瞬見せる
      if(isBook){
        try{
          battleBestHint=mvIdx;
          battleIsFinal=false;
          render();
          await new Promise(r=>setTimeout(r, 400));
        }catch(e){}
      }
      // BB用のnewBoardと配列用のflips両方取得
      const flipsArr = getFlipsForBoard(battleBoard, myC, mvIdx);
      const newBoard=doMoveBattle(P,O,mvIdx);
      if(!newBoard){ 
        logErr('doMoveBattle returned null for mvIdx:'+mvIdx+' P:'+P.toString(16)+' O:'+O.toString(16)+' flips check');
        const fl=flips(P,O,1n<<BigInt(mvIdx));
        logErr('flips:'+fl.toString(16));
        resolve(null); return; 
      }
      // Phase11: battleBoard正で直接適用、boardは触らない（通常対局保護） BigIntはAI用のみ
      battleBoard[mvIdx]=myC;
      for(let f of flipsArr) battleBoard[f]=myC;
      // BBはAI用にのみ同期
      try{ syncBattleBBFromBoard(); }catch(e){}
      const file=String.fromCharCode(97+(mvIdx%8));
      const rank=(Math.floor(mvIdx/8)+1).toString();
      battleHist.push(file+rank);
      battleLastMove=mvIdx;
      battleBestHint=-1;
      battleIsFinal=false;
      turnBlack=!turnBlack;
      battleTurnBlack=turnBlack;
      moves++;
      try{ render(); }catch(e){}
      try{ document.getElementById('battle-current').textContent=\\\`Game \\\${gameId} \\\${blackEngine}(B) vs \\\${whiteEngine}(W) - \\\${battleHist.length}手目 \\\${file+rank} \\\${useBank?\\\`(貯金 B:\\\${(battleBankB/1000).toFixed(1)}s W:\\\${(battleBankW/1000).toFixed(1)}s)\\\`:''}\\\`; }catch(e){}
      try{ let b=0,w=0; for(let v of battleBoard){ if(v===1) b++; else if(v===2) w++; } document.getElementById('s-b').textContent=b; document.getElementById('s-w').textContent=w; }catch(e){}
      setTimeout(battleProcess, 400);
    }
    battleProcess();
  });
}

function doMoveBattle(P,O,idx){
  const bit=1n<<BigInt(idx);
  const fl=flips(P,O,bit);
  if(fl===0n) return null;
  const nP=(P | bit | fl) & MASK64;
  const nO=(O & (MASK64 ^ fl)) & MASK64;
  return {P:nP, O:nO};
}

let battleDepthStatsB={min:Infinity,max:-Infinity,sum:0,count:0,avg:0,cur:0};
let battleDepthStatsW={min:Infinity,max:-Infinity,sum:0,count:0,avg:0,cur:0};

function resetBattleDepthStats(){
  battleDepthStatsB={min:Infinity,max:-Infinity,sum:0,count:0,avg:0,cur:0};
  battleDepthStatsW={min:Infinity,max:-Infinity,sum:0,count:0,avg:0,cur:0};
}
function updateBattleDepthStatsUI(depth, color){
  if(!isFinite(depth)||depth<=0) return;
  const stats = color==='black'? battleDepthStatsB : battleDepthStatsW;
  stats.cur = depth;
  stats.min = Math.min(stats.min, depth);
  stats.max = Math.max(stats.max, depth);
  stats.sum += depth;
  stats.count++;
  stats.avg = stats.sum / stats.count;
  try{
    const suffix = color==='black'? '-b':'-w';
    const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=val; };
    const fmt = (d)=>{ if(!isFinite(d)||d<=0) return '-'; const y=getYojijukugoShort(d); const ds=Number.isInteger(d)?\\\`\\\${d}\\\`:d.toFixed(1); return \\\`\\\${y}(\\\${ds}手)\\\`; };
    set('t-yoji-cur'+suffix, fmt(depth));
    set('t-yoji-min'+suffix, stats.min===Infinity?'-':fmt(stats.min));
    set('t-yoji-max'+suffix, stats.max===-Infinity?'-':fmt(stats.max));
    set('t-yoji-avg'+suffix, stats.count? fmt(stats.avg) : '-');
    set('t-d-cnt'+suffix, stats.count);
  }catch(e){}
}

document.getElementById('battle-start').addEventListener('click', async ()=>{
  // CRITICAL: Prewarm AudioContext AND addModule SYNCHRONOUSLY within user gesture
  // Meta AI requires addModule to be called within same tick as click, otherwise suspended
  try {
    if (!window.prewarmedAudioContext || window.prewarmedAudioContext.state === 'closed') {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      window.prewarmedAudioContext = ctx;
      prewarmedAudioContext = ctx;
      logErr('Battle-start: Prewarmed AudioContext created, state:'+ctx.state+' sampleRate:'+ctx.sampleRate);
      // Force running with dummy buffer + resume - CRITICAL for Meta AI
      try {
        const dummy = ctx.createBufferSource();
        dummy.buffer = ctx.createBuffer(1, 1, 22050);
        dummy.connect(ctx.destination);
        dummy.start(0);
        logErr('Battle-start: Dummy buffer started, state:'+ctx.state);
      } catch(e) { logErr('Battle-start: Dummy failed: '+e.message); }
      try { 
        ctx.resume(); 
        logErr('Battle-start: Called resume(), state:'+ctx.state);
      } catch(e) {}
      // Try second context if first still suspended
      if (ctx.state === 'suspended') {
        try {
          const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
          const dummy2 = ctx2.createBufferSource();
          dummy2.buffer = ctx2.createBuffer(1, 1, 22050);
          dummy2.connect(ctx2.destination);
          dummy2.start(0);
          ctx2.resume();
          logErr('Battle-start: Second context state:'+ctx2.state);
          if (ctx2.state === 'running') {
            try { ctx.close(); } catch(e) {}
            window.prewarmedAudioContext = ctx2;
            prewarmedAudioContext = ctx2;
            logErr('Battle-start: Switched to second running context');
          } else {
            try { ctx2.close(); } catch(e) {}
          }
        } catch(e) { logErr('Battle-start: Second context failed: '+e.message); }
      }
      // Immediately start addModule within gesture - THIS IS KEY
      try {
        const finalCtx = window.prewarmedAudioContext;
        const blob = new Blob([OTHELLO_PROCESSOR_CODE], {type:'text/javascript'});
        const url = URL.createObjectURL(blob);
        // Use .call to avoid Illegal invocation
        const addModuleFn = finalCtx.audioWorklet.addModule.bind(finalCtx.audioWorklet);
        window.prewarmedAddModulePromise = addModuleFn(url).then(() => {
          URL.revokeObjectURL(url);
          logErr('Battle-start: Prewarmed addModule OK, state:'+finalCtx.state);
        }).catch(e => {
          URL.revokeObjectURL(url);
          logErr('Battle-start: Prewarmed addModule FAILED: '+e.message+' stack:'+(e.stack||'').slice(0,500));
          throw e;
        });
        window.prewarmedAddModuleUrl = url;
        logErr('Battle-start: addModule started within gesture, state:'+finalCtx.state);
      } catch(e) {
        logErr('Battle-start: addModule start failed: '+e.message+' stack:'+(e.stack||'').slice(0,500));
      }
    } else {
      logErr('Battle-start: Reusing existing prewarmed context, state:'+window.prewarmedAudioContext.state);
      try { 
        const dummy = window.prewarmedAudioContext.createBufferSource();
        dummy.buffer = window.prewarmedAudioContext.createBuffer(1, 1, 22050);
        dummy.connect(window.prewarmedAudioContext.destination);
        dummy.start(0);
        window.prewarmedAudioContext.resume(); 
      } catch(e) {}
      // FIX: if promise missing, create it now within gesture - direct call
      try {
        if (!window.prewarmedAddModulePromise && typeof OTHELLO_PROCESSOR_CODE !== 'undefined' && OTHELLO_PROCESSOR_CODE) {
          const finalCtx = window.prewarmedAudioContext;
          const blob = new Blob([OTHELLO_PROCESSOR_CODE], {type:'text/javascript'});
          const url = URL.createObjectURL(blob);
          try {
            window.prewarmedAddModulePromise = finalCtx.audioWorklet.addModule(url).then(() => {
              URL.revokeObjectURL(url);
              logErr('Battle-start reuse: addModule OK, state:'+finalCtx.state);
            }).catch(e => {
              URL.revokeObjectURL(url);
              logErr('Battle-start reuse: addModule FAILED: '+e.message);
              window.prewarmedAddModulePromise = null;
              throw e;
            });
          } catch(e) {
            window.prewarmedAddModulePromise = finalCtx.audioWorklet.addModule.call(finalCtx.audioWorklet, url).then(() => {
              URL.revokeObjectURL(url);
              logErr('Battle-start reuse: addModule OK via call, state:'+finalCtx.state);
            }).catch(e2 => {
              URL.revokeObjectURL(url);
              logErr('Battle-start reuse: addModule FAILED via call: '+e2.message);
              window.prewarmedAddModulePromise = null;
              throw e2;
            });
          }
          window.prewarmedAddModuleUrl = url;
          logErr('Battle-start reuse: addModule started within gesture, state:'+finalCtx.state);
        }
      } catch(e) {
        logErr('Battle-start reuse addModule failed: '+e.message+' name:'+e.name);
      }
    }
  } catch(e) {
    logErr('Battle-start prewarm failed: '+e.message+' stack:'+(e.stack||'').slice(0,500));
  }
  if(battleRunning) return;
  battleRunning=true;
  battleNumGames=parseInt(document.getElementById('battle-num').value,10);

  let selectedBlackEngine = document.getElementById('battle-black-engine') ? document.getElementById('battle-black-engine').value : 'classical';
  let selectedWhiteEngine = document.getElementById('battle-white-engine') ? document.getElementById('battle-white-engine').value : 'ml';

  if(useBank){ depth=64; try{ document.getElementById('battle-depth').value='64'; }catch(e){} }

  // ステータス欄リセット
  try{
    document.getElementById('t-st').textContent='対局開始';
    document.getElementById('t-yoji-cur-b').textContent='-';
    document.getElementById('t-yoji-min-b').textContent='-';
    document.getElementById('t-yoji-max-b').textContent='-';
    document.getElementById('t-yoji-avg-b').textContent='-';
    document.getElementById('t-d-cnt-b').textContent='0';
    document.getElementById('t-yoji-cur-w').textContent='-';
    document.getElementById('t-yoji-min-w').textContent='-';
    document.getElementById('t-yoji-max-w').textContent='-';
    document.getElementById('t-yoji-avg-w').textContent='-';
    document.getElementById('t-d-cnt-w').textContent='0';
  }catch(e){}

  // Step1: prewarmed待機スキップ
  if (window.prewarmedAddModulePromise) {
    logErr('Battle-start: prewarmedスキップ Step1');
  }

  battleResults=[];
  document.getElementById('battle-results').innerHTML='';
  logErr('Battle-start: Entering battle loop, numGames:'+battleNumGames);
  try{ document.getElementById('battle-progress').textContent='バトルループ開始'; }catch(e){}
  for(let i=1;i<=battleNumGames;i++){
    if(!battleRunning) break;
    document.getElementById('battle-progress').textContent=\\\`\\\${i}/\\\${battleNumGames} 対局中...\\\`;
    let selBlack = (document.getElementById('battle-black-engine')?.value) || 'classical';

    let blackEng, whiteEng;
    if(alternate){
      blackEng=i%2===1?selBlack:selWhite;
      whiteEng=i%2===1?selWhite:selBlack;
    }else{
      blackEng=selBlack; whiteEng=selWhite;
    }
    const res=await playOneBattleGame(i, blackEng, whiteEng, depth, timeLimit, useBank);
    if(!res) break;
    battleResults.push(res);
    const div=document.createElement('div');
    div.textContent=\\\`Game \\\${res.gameId}: \\\${res.blackEngine}(B) \\\${res.blackCount} - \\\${res.whiteCount} \\\${res.whiteEngine}(W) Winner:\\\${res.winner} \\\${res.duration.toFixed(1)}s\\\`;
    document.getElementById('battle-results').appendChild(div);
    updateBattleAggregate();
    localStorage.setItem('othello_battle_results', JSON.stringify(battleResults));
    await new Promise(r=>setTimeout(r, 500));
  }
  battleRunning=false;
  document.getElementById('battle-progress').textContent=\\\`完了 \\\${battleResults.length}/\\\${battleNumGames}\\\`;
});

function updateBattleAggregate(){

    const whiteIsClassical=r.whiteEngine==='classical';

      if(blackIsClassical) winC++; else winML++;

      if(whiteIsClassical) winC++; else winML++;

  document.getElementById('battle-win-ml').textContent=winML;
  document.getElementById('battle-draw').textContent=draw;

  document.getElementById('battle-rate-ml').textContent=total>0? (winML/total*100).toFixed(1)+'%':'0%';
}
